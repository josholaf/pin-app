name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate real icons if the Windows .ico is missing or an empty placeholder
          if [ ! -s src-tauri/icons/icon.ico ]; then
            echo "icon.ico missing or empty - generating real icon set"
            node scripts/gen-icon.mjs
            npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.4' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.4' }}"
          releaseBody: |
            **Pin v0.1.4** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.4

            ### ✨ Features
            - **Offline status dot** — small dot in the note status bar (between Ln/Col and word count); green when online, amber with an "Offline" label when not
            - **Circle checkboxes in markdown notes** — larger 18px circular task checkboxes that fill with the accent color when checked
            - **Native window edges** — OS-native window frame, no more overlapping card look
            - **Right-click to change note icon** — right-click the note title to pick an icon from a popover; the icon sidebar is gone
            - **FolderCheck icon** — replaces the Clock icon in the icon bank
            - **New app icon** — black rounded square with the green Lucide pin

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
