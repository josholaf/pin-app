name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.35' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.35' }}"
          releaseBody: |
            **Pin v0.1.35** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.35

            **Restores the features accidentally dropped by the v0.1.32–v0.1.34 list cleanup:**
            - **Command palette** — <kbd>Ctrl/Cmd</kbd>+<kbd>K</kbd> to run any command: new note/folder, toggle theme, settings, trash, export/import, quick capture, graph view, Quick Note, web clipper, open or pin any note
            - **Graph view** — animated force-directed map of your notes and their `[[wiki-links]]`; drag nodes, search to dim non-matches; opens from the titlebar button
            - **Trash with restore** — deleting notes, folders and tasks is now a soft delete; restore or purge from the trash view
            - **Favorites** — star notes from the right-click menu; favorites sort to the top
            - **Pin note to desktop** — float any note as its own tiny always-on-top window
            - **Quick capture box** — the Zap button / <kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> overlay; first line becomes the title
            - **Quick Note window** — Spotlight-style capture via <kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd>
            - **Web clipper** — paste a URL to save the clean article, or clip selected text with <kbd>Ctrl/Cmd</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd>
            - **Tray icon + hide to tray** — closing the main window hides it to the tray (Show Pin / Quick Note / Quit)
            - **Stats bar + focus counter** — live notes/tasks/words/trash counts and today's focus sessions
            - **Save safety net** — <kbd>Ctrl/Cmd</kbd>+<kbd>S</kbd> saves now, <kbd>Ctrl/Cmd</kbd>+<kbd>Z</kbd> undoes content (60-step history)
            - **ZIP export / import** — back up the whole library as .md files in a ZIP
            - **Icon & color pickers** back in the right-click note menu (now with 12 colors)
            - Note rows stay clean (icon + title only) — all actions remain in the right-click menu

            Everything from v0.1.34 is kept: reminders with beep + toast + red due badge, the Inbox folder for scheduled notes, 12 note colors, README logo, hover/search polish.

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Diagnose Windows bundle failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis > diag-nsis.log 2>&1 || true
          npm run tauri build -- --bundles msi > diag-msi.log 2>&1 || true
          { grep -iE "error|failed|panicked" diag-nsis.log | tail -n 25; grep -iE "error|failed|panicked" diag-msi.log | tail -n 25; tail -n 20 diag-msi.log; } > hits.txt || true
          awk 'length($0)>0' hits.txt | tail -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
