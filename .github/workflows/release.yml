name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.33' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.33' }}"
          releaseBody: |
            **Pin v0.1.33** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.33

            - **Release build fixed** — the note list cleanup left the note editor with a stale prop set, which broke the type-check on every platform and blocked the release. Tags, the "/tags" picker and wiki-links work again in the editor
            - **Cleaner list** — inline pencil/delete buttons are gone from note and folder rows; right-click a row for Edit, New note (folders) and Delete
            - **Decorated audio player for recordings** — in-note voice recordings are interactive cards: a circular play button that morphs into pause bars, an animated waveform that ripples while playing, a progress bar and a live time counter. Tap the card to play or pause
            - The player card follows your theme and accent color, in light and dark mode
            - **PDF export stays clean** — embedded recordings and data-URI images are skipped when exporting to PDF instead of dumping their base64 into the document

            ### Fixes (v0.1.31)
            - **Export notes as PDF** — a PDF button in the note toolbar saves the note as a real A4 PDF: title header and date, headings, bullets, task checkboxes, code blocks, wrapping, page numbers

            ### Fixes (v0.1.30)
            - **Auto-pairing brackets** — typing `(`, `[`, `{` or `"` automatically inserts the closing character; `[` after `[` completes into `[[ ]]`; typing an existing closer skips over it
            - **Wiki-links work in plain-text notes** — `[[note]]` links are clickable in TXT notes as well

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Diagnose Windows bundle failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis > diag-nsis.log 2>&1 || true
          npm run tauri build -- --bundles msi > diag-msi.log 2>&1 || true
          { grep -iE "error|failed|panicked" diag-nsis.log | tail -n 25; grep -iE "error|failed|panicked" diag-msi.log | tail -n 25; tail -n 20 diag-msi.log; } > hits.txt || true
          awk 'length($0)>0' hits.txt | tail -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
