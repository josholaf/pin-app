name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.13' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.13' }}"
          releaseBody: |
            **Pin v0.1.13** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.13

            ### ✨ New in this release
            - **Clean note list** (#30) — the inline delete / rename / pin / star buttons are gone from note and folder rows. Right-click any note for the full menu: Edit, Rename, Pin to desktop, Favorite, Change color, Change icon, Delete.
            - **macOS-style code blocks** (#30) — every fenced code block renders as a little Mac window: red / yellow / green traffic lights in the title bar with the language name on the right side. The chrome appears automatically from the live preview while you edit inside the block.
            - **Code language detection** (#30) — fence tags now accept any language (````html`, ````rust`, ````c++`, ````c#` ...), and untagged blocks get their language auto-detected from the code itself (HTML, Python, Rust, JS/TS, C/C++, JSON, SQL, CSS, Bash, Go, YAML).

            ### 🚀 Previously shipped
            - Coding fonts (Fira Code, Source Code Pro, Hack) + smart font dropdown with per-font previews (v0.1.12)
            - Photo upload with 12px radius, 1-4 column grids, in-note audio recording and playback (v0.1.11)
            - Tags on command (`/tags` picker, Obsidian-style), `==highlight==` and colored text (v0.1.10)
            - Accent-colored bullets and checkboxes + slash command menu (v0.1.9)
            - Line numbers in the note editor (v0.1.8)
            - Instant dark mode, themed window controls, full right-click note menu, colored tags with suggestions, markdown table button, syntax-highlighted code blocks (v0.1.7)
            - Stats footer, pomodoro focus session counter, Ctrl+S save flash with undo (v0.1.6)

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
