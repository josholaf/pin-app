name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate real icons if the Windows .ico is missing or an empty placeholder
          if [ ! -s src-tauri/icons/icon.ico ]; then
            echo "icon.ico missing or empty - generating real icon set"
            node scripts/gen-icon.mjs
            npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.3' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.3' }}"
          releaseBody: |
            **Pin v0.1.3** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.3

            ### ✨ Features
            - **Single-window notes** — notes open inside the main window (no more separate tabs)
            - **Note color picker** — color circle in the sticky note titlebar
            - **Ln / Col status bar** — live caret line/column and word count at the bottom of the note
            - **Note search** — live search across titles and content, with match count
            - **Global quick-capture hotkey** — `Ctrl+Shift+P` (macOS: `Cmd+Shift+P`) from any app brings Pin to the front with a fresh note
            - **Storage management** — Settings → Storage shows your data location and item counts, with JSON export / import backups and clear-all-data

            ### 🐛 Fixes
            - Note titles can now be renamed (the title bar no longer swallows clicks for window dragging)
            - Explicit pencil rename button on every note row
            - Dark mode no longer resets when opening a note

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
