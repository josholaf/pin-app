name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.7' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.7' }}"
          releaseBody: |
            **Pin v0.1.7** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.7

            ### ✨ New in this release
            - **Instant dark mode** (#18) — the saved theme is applied before the app renders, so dark mode never flashes light on launch, and theme flips from the Settings window land in 150 ms
            - **Themed window controls** (#18) — the titlebar with the app logo now has its own minimize and close buttons that follow dark mode (native frame decorations off)
            - **Full right-click note menu** (#18) — Edit, Rename, Pin to desktop, Favorite, Delete and Change icon, all in one menu
            - **Colored tags with suggestions** (#18) — every tag keeps its own color on chips and filters, and the tag input suggests tags you already created
            - **Markdown table button** (#18) — one click inserts a ready-made table skeleton (tables render with alignment)
            - **Syntax-colored code blocks** (#18) — ```python (or js, ts, rust, c/cpp, bash, json, yaml, sql) shows the language label and colors keywords, strings, comments, numbers and function calls

            ### 🚀 Previously shipped
            - Stats footer, pomodoro focus session counter, Ctrl+S save flash with undo (v0.1.6)
            - Trash with restore (#4), favorite notes (#10), font inheritance fix + 45 icons (#12), modern font dropdown with bundled JetBrains Mono (#14)

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
