name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.30' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.30' }}"
          releaseBody: |
            **Pin v0.1.30** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.30

            - **Auto-pairing brackets** — typing `(`, `[`, `{` or `"` in a note now automatically inserts the closing character with the caret inside: `(` becomes `(|)`, and selecting text first wraps it in the pair
            - **`[[ ]]` auto-pairs too** — typing `[` right after another `[` completes it into `[[|]]` ready for a note link
            - **Typing a closer skips over it** — if the closing character is already at the caret, typing it again just moves past instead of doubling up
            - **Wiki-links work in plain-text notes** — `[[note]]` links were only clickable in markdown notes; they now render as clickable links in TXT notes as well, and clicking a link whose brackets were passed as plain text no longer fails

            ### Fixes (v0.1.29)
            - **Graph view button in the titlebar** — the graph view existed but was only reachable through the command palette; there is now a visible Graph button next to the palette button

            ### Fixes (v0.1.28)
            - **External links open the browser** — clicking a link in a note now opens it in the default web browser, Obsidian-style; previously target="_blank" did nothing inside the app window
            - **Web clipper works** — the http plugin grants no origins by default, so every page fetch was denied; the Web Clips fetch now allows https and http URLs
            - Wiki-links ([[note]]) keep behaving like Obsidian: clicking opens the target note, creating it if missing

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


      - name: Diagnose Windows bundle failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis > diag-nsis.log 2>&1 || true
          npm run tauri build -- --bundles msi > diag-msi.log 2>&1 || true
          { grep -iE "error|failed|panicked" diag-nsis.log | tail -n 25; grep -iE "error|failed|panicked" diag-msi.log | tail -n 25; tail -n 20 diag-msi.log; } > hits.txt || true
          awk 'length($0)>0' hits.txt | tail -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
