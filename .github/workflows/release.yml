name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.5' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.5' }}"
          releaseBody: |
            **Pin v0.1.5** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

                        ## What's new in v0.1.5

            ### ✨ Features
            - **Pin note to desktop** (#3) — float any note as a small always-on-top sticky window, from the note list, the editor header or the command palette
            - **Trash with restore** (#4) — deleted notes now go to a Trash section in the sidebar; restore them individually or delete them forever
            - **Note tags with filter chips** (#5) — add colored tags in the note editor and filter the note list with tag chips
            - **Command palette (Ctrl/Cmd+K)** (#6) — fuzzy-search commands and notes: new note, new folder, theme, settings, open or pin any note
            - **Export & copy notes** (#7) — export a note as .md/.txt through the native save dialog, or copy it as plain text from the editor header
## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
