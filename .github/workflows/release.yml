name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.29' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.29' }}"
          releaseBody: |
            **Pin v0.1.29** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.29

            - **Graph view button in the titlebar** — the graph view (a map of your notes and their wiki-links, with search) existed but was only reachable through the command palette; there is now a visible Graph button next to the palette button, so it can no longer hide

            ### Fixes (v0.1.28)
            - **External links open the browser** — clicking a link in a note now opens it in the default web browser, Obsidian-style; previously target="_blank" did nothing inside the app window
            - **Web clipper works** — the http plugin grants no origins by default, so every page fetch was denied; the Web Clips fetch now allows https and http URLs
            - Wiki-links ([[note]]) keep behaving like Obsidian: clicking opens the target note, creating it if missing

            ### Previously (v0.1.27)

            This release completes the release build fix (#44, #46): the capabilities file requested the non-existent core:process:allow-exit permission, which failed the Rust build; it now uses core:app:allow-exit, and the tray Quit action destroys all windows via getAllWindows() from @tauri-apps/api/window; npm install had also been failing since v0.1.12 on a phantom @fontsource/hack dependency that does not exist on npm, and the type-check then failed on a missing brace plus invalid props and a removed Tauri v2 module. With all that fixed, every feature shipped since v0.1.11 is finally in a published release:

            ### 📌 Web clipper (v0.1.18)
            - **Clip webpages** — paste a URL, Pin extracts just the article as clean markdown: no ads, nav, cookie banners, share bars or page address
            - **Clip selected text** — copy text anywhere, press Ctrl+Shift+C, it becomes a note
            - Both save into an auto-created Web Clips folder, tagged `web` / `clip`

            ### 📌 Quick Note window + tray (v0.1.17)
            - Ctrl+Shift+N opens a Spotlight-style black composer from anywhere; markdown, slash commands and voice notes inside; saves to a Quick Notes folder
            - Title modes: Custom (leading `*` marks the title) or Date (DD-MM-YY)
            - Tray icon (Show Pin / Quick Note / Quit); closing the main window hides it to the tray

            ### 📌 Focus mode (v0.1.16)
            - Distraction-free writing overlay with typewriter scrolling and a quiet word count

            ### 📌 Quick capture + graph view (v0.1.15)
            - Global Ctrl+Shift+P capture box, first line becomes the title
            - Graph view mapping notes and their wiki-links, with search

            ### 📌 Wiki-links, reminders, backup (v0.1.14)
            - `[[wiki-links]]` with autocomplete and a Linked mentions backlinks section
            - Note reminders with beep, toast and due badge
            - Library export/import (ZIP of markdown)

            ### 📌 Editor & list polish (v0.1.13)
            - Clean note list, right-click menu with everything
            - macOS-style code blocks with language detection and syntax coloring

            ### 📌 Coding fonts (v0.1.12)
            - JetBrains Mono, Fira Code and Source Code Pro bundled offline, plus a smart font dropdown with live search and per-font previews

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}


      - name: Diagnose Windows bundle failure
        if: failure() && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npm run tauri build -- --bundles nsis > diag-nsis.log 2>&1 || true
          npm run tauri build -- --bundles msi > diag-msi.log 2>&1 || true
          { grep -iE "error|failed|panicked" diag-nsis.log | tail -n 25; grep -iE "error|failed|panicked" diag-msi.log | tail -n 25; tail -n 20 diag-msi.log; } > hits.txt || true
          awk 'length($0)>0' hits.txt | tail -n 10 | while IFS= read -r line; do echo "::error::${line}"; done
