name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          - platform: windows-latest
            args: --bundles nsis,msi
          - platform: macos-latest
            args: --bundles dmg,app

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Type-check frontend (test)
        run: npx tsc --noEmit

      - name: Generate icons if missing
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          # Regenerate icons if the Windows .ico is missing or an empty placeholder.
          # Prefer the committed app logo (black rounded square + green pin, icon.svg);
          # fall back to the generated PNG only if the SVG is absent.
          if [ ! -s src-tauri/icons/icon.ico ]; then
            if [ -s src-tauri/icons/icon.svg ]; then
              echo "icon.ico missing or empty - generating icon set from icon.svg"
              npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
            else
              echo "icon.svg missing - generating fallback icon set"
              node scripts/gen-icon.mjs
              npx tauri icon src-tauri/icons/source-icon.png -o src-tauri/icons
            fi
          fi
          ls -la src-tauri/icons/

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.9' }}
          releaseName: "Pin ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.9' }}"
          releaseBody: |
            **Pin v0.1.9** — lightweight sticky-note style task & note app for Windows, macOS and Linux.

            ## What's new in v0.1.9

            ### ✨ New in this release
            - **Accent-colored lists** (#22) — bullet markers, numbered markers and circle checkboxes (task list and markdown preview) now use your accent color from Settings instead of muted gray
            - **Slash commands** (#22) — type "/" while editing to insert blocks fast: Heading 1-4, Task, Bullet list, Numbered list, Bold, Italic, Strikethrough, Code block, Quote, Table, Link, Divider. Arrow keys navigate, Enter/Tab inserts, Esc closes; keep typing to filter

            ### 🚀 Previously shipped
            - Line numbers in the note editor (v0.1.8)
            - Instant dark mode, themed window controls, full right-click note menu, colored tags with suggestions, markdown table button, syntax-highlighted code blocks (v0.1.7)
            - Stats footer, pomodoro focus session counter, Ctrl+S save flash with undo (v0.1.6)

            ## Downloads
            - **Windows**: `.msi` or `.exe` (NSIS)
            - **macOS**: `.dmg`
            - **Linux**: `.deb` or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
